name: audit

# Executa o auditor (audit_repos.py) sem depender de alguem estar na maquina.
# Motivo: arquivo de workflow no disco nao prova
# execucao - so a corrida registrada na API do Actions prova. Este workflow
# EH a corrida.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC todo dia, sozinho
  workflow_dispatch: {}     # corrida manual, para provar/depurar sem esperar o cron

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Testes primeiro: nao dependem de segredo nenhum, entao um fork ou um PR
      # de fora ainda prova o codigo mesmo sem acesso aos secrets.
      - name: Suite de testes do proprio auditor
        run: python -m unittest discover -s tests

      - name: gh CLI ja vem no runner (confere versao)
        run: gh --version

      # A conta auditada e DADO, nao codigo: nao mora no repo (ver .gitignore e
      # declaracoes.example.json). Quem roda a auditoria de verdade guarda o
      # JSON inteiro como secret NL_AUDIT_DECLARACOES.
      - name: Materializa declaracoes.json a partir do secret
        id: declaracoes
        env:
          DECLARACOES: ${{ secrets.NL_AUDIT_DECLARACOES }}
        run: |
          if [ -z "$DECLARACOES" ]; then
            echo "::warning::secret NL_AUDIT_DECLARACOES ausente - falha-de-credencial," \
                 "nao achado. O auditor nao tem estado declarado para comparar. Copie" \
                 "declaracoes.example.json, preencha e rode: gh secret set" \
                 "NL_AUDIT_DECLARACOES < declaracoes.json"
            echo "falta=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$DECLARACOES" > declaracoes.json
          python -c "import json;json.load(open('declaracoes.json'))"
          echo "falta=0" >> "$GITHUB_OUTPUT"

      # Roda o auditor e CLASSIFICA o desfecho em tres baldes distintos, em vez de
      # sair vermelho para tudo. So achado-real reprova o alvo (job seguinte).
      # falha-de-credencial e falha-do-auditor ficam visiveis (warning + resumo do
      # job), mas nao mentem que o ALVO esta quebrado quando quem quebrou foi a
      # propria infra do auditor.
      - name: Roda o auditor e classifica o desfecho
        id: auditoria
        env:
          # PAT classico, escopo "repo" (leitura basta), criado pelo dono do repo e
          # guardado como secret deste repo. O GITHUB_TOKEN padrao do Actions
          # so enxerga o proprio repo - nao alcanca os demais repos da conta.
          # Setup (uma vez, 2 min): https://github.com/settings/tokens ->
          # generate classic token, escopo "repo" -> `gh secret set
          # GH_AUDIT_PAT --repo <owner>/<repo>` (cola so no prompt
          # oculto do terminal, nunca aqui).
          GH_TOKEN: ${{ secrets.GH_AUDIT_PAT }}
          DECLARACOES_FALTOU: ${{ steps.declaracoes.outputs.falta }}
        run: |
          if [ "$DECLARACOES_FALTOU" = "1" ]; then
            code=2
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::secret GH_AUDIT_PAT ausente - falha-de-credencial, nao" \
                 "achado. Auditor nao pode ler os demais repos com o GITHUB_TOKEN" \
                 "padrao (escopo so deste repo). Setup no comentario do step anterior."
            code=2
          else
            set +e
            python audit_repos.py
            code=$?
            set -e
          fi
          python classificar_desfecho.py "$code" >> "$GITHUB_OUTPUT"
          python classificar_desfecho.py "$code" --resumo >> "$GITHUB_STEP_SUMMARY"

      - name: Reprova o alvo SOMENTE em achado-real
        if: steps.auditoria.outputs.desfecho == 'achado-real'
        run: |
          echo "::error::achado-real - o alvo auditado esta em violacao de verdade." \
               "Ver o resumo do job para o detalhe."
          exit 1

      - name: Sinaliza falha-de-credencial (nao reprova o alvo, mas fica visivel)
        if: steps.auditoria.outputs.desfecho == 'falha-de-credencial'
        run: |
          echo "::warning::FALHA-DE-CREDENCIAL - o auditor nao rodou de verdade." \
               "Isto e infra do proprio auditor, nunca um achado sobre o alvo."

      - name: Sinaliza falha-do-auditor (nao reprova o alvo, mas precisa de conserto)
        if: steps.auditoria.outputs.desfecho == 'falha-do-auditor'
        run: |
          echo "::warning::FALHA-DO-AUDITOR - o job quebrou (codigo" \
               "${{ steps.auditoria.outputs.codigo }}). Isto e bug do auditor," \
               "nunca um achado sobre o alvo."
