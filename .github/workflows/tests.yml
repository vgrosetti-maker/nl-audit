name: tests

# Roda em qualquer clone, sem segredo nenhum. E o unico check que um leitor de
# fora consegue reproduzir na maquina dele: se ficar vermelho aqui, esta
# vermelho para ele tambem.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests
